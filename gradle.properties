org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true

# 本机为 aarch64，Google 只发布 x86_64 版 aapt2。这里把 AGP 的 aapt2 指到
# 本地 qemu-user 包装器（与 AGP 8.6.1 期望的 aapt2 2.19-11315950 版本一致）。
android.aapt2FromMavenOverride=/workspace/upgrade-cache/aapt2-wrapper-bin/aapt2
