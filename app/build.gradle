plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.oplusime.panel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.oplusime.panel'
        minSdk 23
        targetSdk 34
        // 1.33.60：主键盘 body.*.z/y 的抬起方法把 SoftKey 作为内部指针表项保存，调用参数末位可能为 null；在 before hook 中从宿主指针表恢复 SoftKey.a=66。
        versionCode 99
        versionName '1.33.60'
    }

    // 本模块自带的签名库（自建，与宿主无关）。如要换成自己的，替换下面四项即可。
    signingConfigs {
        selfbuilt {
            storeFile rootProject.file('keystore/oplusime-panel.jks')
            storePassword 'oplusime-panel'
            keyAlias 'oplusime'
            keyPassword 'oplusime-panel'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.selfbuilt
            buildConfigField 'boolean', 'DEFAULT_LOG_ENABLED', 'true'
        }
        release {
            // 模块大量使用反射与 DexKit 原生库，关闭 R8 以免误裁剪。
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.selfbuilt
            buildConfigField 'boolean', 'DEFAULT_LOG_ENABLED', 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // DexKit 的 libdexkit.so 直接由 APK 映射，不做 legacy 解压。
            useLegacyPackaging false
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // DexKit：宿主定位的唯一来源（结构特征 + 语义锚点）。
    implementation 'org.luckypray:dexkit:2.2.0'

    // Xposed API 仅编译期使用，绝不打进模块 APK。
    compileOnly files('libs/api-82.jar')
}
